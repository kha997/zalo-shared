name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-isolated-only
          POSTGRES_DB: zalo_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d zalo_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci-isolated-only@127.0.0.1:5432/zalo_test
      TEST_DATABASE_URL: postgresql://ci:ci-isolated-only@127.0.0.1:5432/zalo_test
      PUBLIC_ORIGIN: http://127.0.0.1:3100
      CHROMIUM_PATH: bundled
      LOGIN_RATE_LIMIT: "3000"
      PROVIDER_MODE: mock
      MOCK_ENABLED: "true"
      METRICS_TOKEN: ci-isolated-metrics-only
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: CI-isolated-password-94!test
      TEST_ADMIN_EMAIL: ci-admin@example.test
      TEST_ADMIN_PASSWORD: CI-isolated-password-94!test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: mkdir -p docs/evidence && npm audit --audit-level=high --json | tee docs/evidence/ci-audit.json
      - name: Verify registry signatures and provenance
        timeout-minutes: 2
        run: npm audit signatures --json | tee docs/evidence/ci-sdk-signatures.log
      - run: npm run build
      - run: npm test | tee docs/evidence/ci-tests.log
      - name: Actual SDK offline contract guards
        run: npm run test:sdk | tee docs/evidence/ci-sdk-contracts.log
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate && npm run seed
      - name: Browser and measured load integration
        shell: bash
        run: |
          node --import tsx server/main.ts > /tmp/zalo-app.log 2>&1 &
          app_pid=$!
          node --import tsx server/worker.ts > /tmp/zalo-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$app_pid" "$worker_pid" 2>/dev/null || true; wait "$app_pid" "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/health/ready > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3100/health/ready > /dev/null
          npm run test:e2e
          LOAD_USERS=4,10,25,50 LOAD_ROUNDS=3 npm run test:load | tee docs/evidence/ci-load.log
          LOAD_USERS=50 LOAD_ROUNDS=50 LOAD_PROFILE=sustained npm run test:load | tee docs/evidence/ci-load-sustained.log
          LOAD_USERS=100,200,500 LOAD_ROUNDS=3 LOAD_PROFILE=capacity npm run test:load | tee docs/evidence/ci-load-capacity.log
      - name: Seed representative provider journal recovery states
        env:
          CI_PROVIDER_JOURNAL_DISPOSABLE: "yes"
        run: node --import tsx ops/ci-provider-journal.ts | tee docs/evidence/ci-provider-journal-fixture.log
      - name: Unclean PostgreSQL restart preserves committed data
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp ops "$PG_CONTAINER":/tmp/zalo-ops
          docker exec "$PG_CONTAINER" psql -X -U ci -d zalo_test -At -f /tmp/zalo-ops/integrity.sql > docs/evidence/ci-durability-before.tsv
          docker kill --signal=KILL "$PG_CONTAINER"
          docker start "$PG_CONTAINER"
          for attempt in {1..30}; do
            if docker exec "$PG_CONTAINER" pg_isready -U ci -d zalo_test; then break; fi
            sleep 1
          done
          docker exec "$PG_CONTAINER" psql -X -U ci -d zalo_test -At -f /tmp/zalo-ops/integrity.sql > docs/evidence/ci-durability-after.tsv
          cmp docs/evidence/ci-durability-before.tsv docs/evidence/ci-durability-after.tsv
          echo 'Unclean database restart: committed content fingerprints PASS'
      - name: Encrypted backup and quarantined restore drill
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" bash -c 'apt-get update -qq && apt-get install -y --no-install-recommends age >/tmp/age-install.log'
          docker cp ops "$PG_CONTAINER":/tmp/zalo-ops
          docker exec "$PG_CONTAINER" bash /tmp/zalo-ops/ci-backup-drill.sh | tee docs/evidence/ci-backup-restore.log
      - name: Private monitoring configuration and alert rule tests
        run: bash ops/check-monitoring.sh | tee docs/evidence/monitoring-validation.log
      - name: Nonroot container build and private health smoke
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          runtime_image=$(awk -F= '/^ARG RUNTIME_IMAGE=/{print $2}' ops/Dockerfile)
          docker pull "$runtime_image"
          runtime_base=$(docker image inspect --format '{{index .RepoDigests 0}}' "$runtime_image")
          printf '%s\n' "$runtime_base" | tee docs/evidence/runtime-base-digest.txt
          docker build --build-arg RUNTIME_IMAGE="$runtime_base" -f ops/Dockerfile -t zalo-shared:ci .
          bash ops/scan-image.sh zalo-shared:ci
          docker run -d --name zalo-ci-smoke --network "container:$PG_CONTAINER" --read-only --tmpfs /tmp:rw,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges:true -e DATABASE_URL -e PROVIDER_MODE=disabled -e MOCK_ENABLED=false -e PUBLIC_ORIGIN=http://127.0.0.1:3100 zalo-shared:ci
          trap 'docker rm -f zalo-ci-smoke' EXIT
          for attempt in {1..30}; do
            if docker exec zalo-ci-smoke /nodejs/bin/node -e 'fetch("http://127.0.0.1:3100/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then break; fi
            sleep 1
          done
          docker exec zalo-ci-smoke /nodejs/bin/node -e 'if(process.getuid()===0||require("node:fs").existsSync("/app/node_modules/zca-js"))process.exit(1);fetch("http://127.0.0.1:3100/health/ready").then(r=>{if(!r.ok)process.exit(1);console.log("nonroot/private/SDK-free readiness PASS")})'
      - name: Preserve synthetic validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-validation-evidence
          path: docs/evidence/
          retention-days: 14
