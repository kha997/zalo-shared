name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-isolated-only
          POSTGRES_DB: zalo_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d zalo_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci-isolated-only@127.0.0.1:5432/zalo_test
      TEST_DATABASE_URL: postgresql://ci:ci-isolated-only@127.0.0.1:5432/zalo_test
      PUBLIC_ORIGIN: http://127.0.0.1:3100
      CHROMIUM_PATH: bundled
      LOGIN_RATE_LIMIT: "3000"
      PROVIDER_MODE: mock
      MOCK_ENABLED: "true"
      METRICS_TOKEN: ci-isolated-metrics-only
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: CI-isolated-password-94!test
      TEST_ADMIN_EMAIL: ci-admin@example.test
      TEST_ADMIN_PASSWORD: CI-isolated-password-94!test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: mkdir -p docs/evidence && npm audit --audit-level=high --json | tee docs/evidence/ci-audit.json
      - name: Verify registry signatures and provenance
        timeout-minutes: 2
        run: npm audit signatures --json | tee docs/evidence/ci-sdk-signatures.log
      - run: npm run build
      - run: npm test | tee docs/evidence/ci-tests.log
      - name: Actual SDK offline contract guards
        run: npm run test:sdk | tee docs/evidence/ci-sdk-contracts.log
      - run: npx playwright install --with-deps chromium
      - run: npm run migrate && npm run seed
      - name: Browser and measured load integration
        shell: bash
        run: |
          node --import tsx server/main.ts > /tmp/zalo-app.log 2>&1 &
          app_pid=$!
          node --import tsx server/worker.ts > /tmp/zalo-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$app_pid" "$worker_pid" 2>/dev/null || true; wait "$app_pid" "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/health/ready > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3100/health/ready > /dev/null
          npm run test:e2e
          LOAD_USERS=4,10,25,50 LOAD_ROUNDS=3 npm run test:load | tee docs/evidence/ci-load.log
          LOAD_USERS=50 LOAD_ROUNDS=50 LOAD_PROFILE=sustained npm run test:load | tee docs/evidence/ci-load-sustained.log
          LOAD_USERS=100,200,500 LOAD_ROUNDS=3 LOAD_PROFILE=capacity npm run test:load | tee docs/evidence/ci-load-capacity.log
      - name: Seed representative provider journal recovery states
        env:
          CI_PROVIDER_JOURNAL_DISPOSABLE: "yes"
        run: node --import tsx ops/ci-provider-journal.ts | tee docs/evidence/ci-provider-journal-fixture.log
      - name: Unclean PostgreSQL restart preserves committed data
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp ops "$PG_CONTAINER":/tmp/zalo-ops
          docker exec "$PG_CONTAINER" psql -X -U ci -d zalo_test -At -f /tmp/zalo-ops/integrity.sql > docs/evidence/ci-durability-before.tsv
          docker kill --signal=KILL "$PG_CONTAINER"
          docker start "$PG_CONTAINER"
          for attempt in {1..30}; do
            if docker exec "$PG_CONTAINER" pg_isready -U ci -d zalo_test; then break; fi
            sleep 1
          done
          docker exec "$PG_CONTAINER" psql -X -U ci -d zalo_test -At -f /tmp/zalo-ops/integrity.sql > docs/evidence/ci-durability-after.tsv
          cmp docs/evidence/ci-durability-before.tsv docs/evidence/ci-durability-after.tsv
          echo 'Unclean database restart: committed content fingerprints PASS'
      - name: Encrypted backup and quarantined restore drill
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" bash -c 'apt-get update -qq && apt-get install -y --no-install-recommends age >/tmp/age-install.log'
          docker cp ops "$PG_CONTAINER":/tmp/zalo-ops
          docker exec "$PG_CONTAINER" bash /tmp/zalo-ops/ci-backup-drill.sh | tee docs/evidence/ci-backup-restore.log
      - name: Private monitoring configuration and alert rule tests
        run: bash ops/check-monitoring.sh | tee docs/evidence/monitoring-validation.log
      - name: Nonroot container build and private health smoke
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          runtime_image=$(awk -F= '/^ARG RUNTIME_IMAGE=/{print $2}' ops/Dockerfile)
          docker pull "$runtime_image"
          runtime_base=$(docker image inspect --format '{{index .RepoDigests 0}}' "$runtime_image")
          printf '%s\n' "$runtime_base" | tee docs/evidence/runtime-base-digest.txt
          docker build --build-arg RUNTIME_IMAGE="$runtime_base" -f ops/Dockerfile -t zalo-shared:ci .
          bash ops/scan-image.sh zalo-shared:ci
          docker run -d --name zalo-ci-smoke --network "container:$PG_CONTAINER" --read-only --tmpfs /tmp:rw,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges:true -e DATABASE_URL -e PROVIDER_MODE=disabled -e MOCK_ENABLED=false -e PUBLIC_ORIGIN=http://127.0.0.1:3100 zalo-shared:ci
          trap 'docker rm -f zalo-ci-smoke' EXIT
          for attempt in {1..30}; do
            if docker exec zalo-ci-smoke /nodejs/bin/node -e 'fetch("http://127.0.0.1:3100/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then break; fi
            sleep 1
          done
          docker exec zalo-ci-smoke /nodejs/bin/node -e 'if(process.getuid()===0||require("node:fs").existsSync("/app/node_modules/zca-js"))process.exit(1);fetch("http://127.0.0.1:3100/health/ready").then(r=>{if(!r.ok)process.exit(1);console.log("nonroot/private/SDK-free readiness PASS")})'
      - name: Preserve synthetic validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-validation-evidence
          path: docs/evidence/
          retention-days: 14
  pilot:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    env:
      # The reviewed commit, not the ephemeral pull_request merge commit that
      # checkout produces. A grant binds to a reviewed SHA, so the built image
      # must embed that SHA and not a merge artifact that later disappears.
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Built tree is the reviewed commit's tree
        run: |
          mkdir -p docs/evidence
          printf 'SOURCE_SHA=%s\nGITHUB_SHA=%s\n' "$SOURCE_SHA" "$GITHUB_SHA"
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "SOURCE_SHA is not a 40-char lowercase SHA"; exit 1; }
          git cat-file -e "$SOURCE_SHA^{commit}"
          built_tree=$(git rev-parse 'HEAD^{tree}')
          source_tree=$(git rev-parse "$SOURCE_SHA^{tree}")
          printf 'built_tree=%s\nsource_tree=%s\n' "$built_tree" "$source_tree" | tee docs/evidence/connector-source-tree.txt
          [ "$built_tree" = "$source_tree" ] || { echo "checked-out tree differs from $SOURCE_SHA"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compile the separate connector entrypoint
        run: npm run build:connector
      - name: Synthetic owner-consent manifest for the offline gate
        run: |
          mkdir -p docs/evidence
          node --import tsx ops/ci-pilot-manifest.ts "$RUNNER_TEMP/pilot-manifest.synthetic.json" | tee docs/evidence/ci-pilot-manifest.log
      - name: Intentional SDK-bearing connector image
        run: |
          builder_image=$(awk -F= '/^ARG BUILDER_IMAGE=/{print $2}' ops/Dockerfile.connector)
          docker pull "$builder_image"
          builder_base=$(docker image inspect --format '{{index .RepoDigests 0}}' "$builder_image")
          printf '%s\n' "$builder_base" | tee docs/evidence/connector-builder-digest.txt
          docker build --build-arg BUILDER_IMAGE="$builder_base" --build-arg SOURCE_COMMIT="$SOURCE_SHA" -f ops/Dockerfile.connector -t zalo-shared-connector:ci .
      - name: Dry-run default performs no vault, SDK, database or network work
        run: |
          # The connector enforces owner-only manifest files; the CI runner UID
          # must match the image runtime UID for the bind mount. The manifest is
          # kept outside docs/evidence so the private-owner file is never zipped
          # into the public artifact.
          sudo chown 65532:65532 "$RUNNER_TEMP/pilot-manifest.synthetic.json"
          sudo chmod 600 "$RUNNER_TEMP/pilot-manifest.synthetic.json"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges:true -v "$RUNNER_TEMP/pilot-manifest.synthetic.json:/run/pilot/manifest.json:ro" -e PILOT_MANIFEST=/run/pilot/manifest.json zalo-shared-connector:ci | tee docs/evidence/ci-pilot-dry-run.json
          grep -q '"ok":true' docs/evidence/ci-pilot-dry-run.json
          grep -q '"command":"dry-run"' docs/evidence/ci-pilot-dry-run.json
      - name: G5 offline preflight admits only the approved scope
        run: |
          for stage in bootstrap observe send-test; do
            node --import tsx ops/g5-synthetic-manifest.ts "$RUNNER_TEMP/g5-$stage.json" "$stage"
            sudo chown 65532:65532 "$RUNNER_TEMP/g5-$stage.json"
            sudo chmod 600 "$RUNNER_TEMP/g5-$stage.json"
            docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges:true -v "$RUNNER_TEMP/g5-$stage.json:/run/pilot/manifest.json:ro" -e PILOT_MANIFEST=/run/pilot/manifest.json zalo-shared-connector:ci dist/connector/tools/pilot-connector.js preflight | tee "docs/evidence/ci-g5-preflight-$stage.json"
            grep -q '"ok":true' "docs/evidence/ci-g5-preflight-$stage.json"
            grep -q '"gate":"admitted"' "docs/evidence/ci-g5-preflight-$stage.json"
            case "$stage" in
              bootstrap) expected=enroll-session ;;
              *) expected=$stage ;;
            esac
            grep -q "\"purpose\":\"$expected\"" "docs/evidence/ci-g5-preflight-$stage.json"
          done
          node --import tsx ops/g5-synthetic-manifest.ts "$RUNNER_TEMP/g5-invalid.json" observe --invalid-scope
          sudo chown 65532:65532 "$RUNNER_TEMP/g5-invalid.json"
          sudo chmod 600 "$RUNNER_TEMP/g5-invalid.json"
          if docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges:true -v "$RUNNER_TEMP/g5-invalid.json:/run/pilot/manifest.json:ro" -e PILOT_MANIFEST=/run/pilot/manifest.json zalo-shared-connector:ci dist/connector/tools/pilot-connector.js preflight > docs/evidence/ci-g5-preflight-denied.json; then
            echo "out-of-scope manifest was admitted"; exit 1
          fi
          grep -q '"gate":"denied"' docs/evidence/ci-g5-preflight-denied.json
      - name: Separate connector scan, SDK inventory and nonroot/port assertions
        run: bash ops/pilot-scan.sh zalo-shared-connector:ci
      - name: Egress gateway image and OS-enforced network boundary
        run: |
          set -o pipefail
          docker build -f ops/Dockerfile.gateway -t zalo-shared-egress-gateway:ci .
          bash ops/local/check-pilot-network.sh | tee docs/evidence/ci-pilot-network.txt
          PILOT_CONNECTOR_IMAGE=zalo-shared-connector:ci \
          PILOT_EGRESS_GATEWAY_IMAGE=zalo-shared-egress-gateway:ci \
            bash ops/local/verify-pilot-network.sh | tee docs/evidence/ci-pilot-boundary.txt
      - name: Offline egress allow-path harness
        run: |
          set +e
          # Root here only to create an unprivileged user+mount+network
          # namespace; the harness itself runs node as an ordinary user inside
          # that namespace and contains all traffic to loopback.
          sudo -E bash ops/local/verify-egress-allowpath.sh | tee docs/evidence/ci-egress-allowpath.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 77 ]; then
            # Exit 77 is the harness's own "cannot run here" result. A broken
            # harness (exit 2 or anything else) must fail the job.
            echo "SKIP: unprivileged namespaces unavailable on this runner" | tee -a docs/evidence/ci-egress-allowpath.log
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Egress gateway image scan
        run: bash ops/scan-image.sh zalo-shared-egress-gateway:ci gateway
      - name: Image build identity matches this commit and the connector lock
        run: |
          node -e '
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const identity = require("./docs/evidence/connector-image-inventory.json").buildIdentity;
          const lock = fs.readFileSync("connector/package-lock.json");
          const sdk = JSON.parse(lock.toString("utf8")).packages["node_modules/zca-js"].integrity;
          if (identity.sourceCommit !== process.env.SOURCE_SHA) throw new Error("source commit mismatch");
          if (identity.lockSha256 !== crypto.createHash("sha256").update(lock).digest("hex")) throw new Error("lock hash mismatch");
          if (identity.sdkIntegrity !== sdk) throw new Error("SDK integrity mismatch");
          '
      - name: Export the exact built connector image for verified deployment
        run: |
          set -o pipefail
          # PRIVATE-PILOT.md makes the CI-built image digest the trust anchor for
          # a grant. A log line cannot carry that, so the image itself leaves the
          # run together with the digest this run recorded for it. A consumer
          # proves the archive is this run's artifact by re-hashing it and by
          # comparing the loaded image id with connector-image-id.txt.
          image_id=$(docker image inspect zalo-shared-connector:ci --format '{{.Id}}')
          printf '%s\n' "$image_id" | tee docs/evidence/connector-image-id.txt
          docker image inspect zalo-shared-connector:ci > docs/evidence/connector-image-inspect.json
          docker save zalo-shared-connector:ci -o "$RUNNER_TEMP/connector-image.tar"
          sha256sum "$RUNNER_TEMP/connector-image.tar" | tee docs/evidence/connector-image-sha256.txt
          node -e '
          const fs = require("node:fs");
          const id = fs.readFileSync("docs/evidence/connector-image-id.txt", "utf8").trim();
          const tar = fs.readFileSync("docs/evidence/connector-image-sha256.txt", "utf8").trim().split(/\s+/)[0];
          const inventory = require("./docs/evidence/connector-image-inventory.json");
          if (!/^sha256:[0-9a-f]{64}$/.test(id)) throw new Error("image id is not a sha256 digest");
          if (!/^[0-9a-f]{64}$/.test(tar)) throw new Error("archive digest is not sha256");
          if (!inventory.buildIdentity || inventory.buildIdentity.sourceCommit !== process.env.SOURCE_SHA) throw new Error("inventory source commit mismatch");
          const manifest = {
            version: 1,
            repository: process.env.GITHUB_REPOSITORY,
            workflowRef: process.env.GITHUB_WORKFLOW_REF,
            eventName: process.env.GITHUB_EVENT_NAME,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            sourceCommit: process.env.SOURCE_SHA,
            imageId: id,
            archiveSha256: tar,
            builderImage: fs.readFileSync("docs/evidence/connector-builder-digest.txt", "utf8").trim(),
            lockSha256: inventory.buildIdentity.lockSha256,
            sdkIntegrity: inventory.buildIdentity.sdkIntegrity,
          };
          fs.writeFileSync("docs/evidence/connector-image-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          cat docs/evidence/connector-image-manifest.json
      - name: Preserve the exact built connector image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-connector-image
          path: |
            ${{ runner.temp }}/connector-image.tar
            docs/evidence/connector-image-id.txt
            docs/evidence/connector-image-sha256.txt
            docs/evidence/connector-image-manifest.json
            docs/evidence/connector-image-inspect.json
          retention-days: 14
      - name: Preserve pilot connector evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-connector-evidence
          path: docs/evidence/
          retention-days: 14
