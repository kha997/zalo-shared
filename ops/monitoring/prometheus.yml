# Configuration only; no collector container, port or deployment is enabled.
# Mount token as a read-only private file accessible only to collector user.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: zalo-shared
    metrics_path: /metrics
    scheme: http
    bearer_token_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['app:3100']
